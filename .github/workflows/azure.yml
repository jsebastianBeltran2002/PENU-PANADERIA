name: Deploy a Azure (Functions + sitio estatico)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FUNCTION_APP: elultimocapitulo-api
  STORAGE_ACCOUNT: elultimocapitulo2026
  SITE_URL: https://elultimocapitulo2026.z22.web.core.windows.net
  API_URL: https://elultimocapitulo-api.azurewebsites.net/api

jobs:
  test:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest flake8
      - run: flake8 azure tests/test_azure_validation.py --max-line-length=100
      - run: pytest tests/test_azure_validation.py -q

  deploy-api:
    name: Deploy API (Azure Functions)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: azure/api
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          scm-do-build-during-deployment: true
          enable-oryx-build: true

  deploy-site:
    name: Deploy sitio (Storage static website)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar la URL de la API
        run: echo "window.API_URL = \"${API_URL}\";" > frontend/config.js
      - name: Subir sitio a \$web
        run: |
          az storage blob upload-batch \
            --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --destination '$web' --source frontend --overwrite

  smoke-test:
    name: Smoke test
    needs: [deploy-api, deploy-site]
    runs-on: ubuntu-latest
    steps:
      - name: Sitio y API responden
        run: |
          curl -fsS "$SITE_URL/index.html" | grep -q "app.js"
          for i in $(seq 1 12); do
            if curl -fsS "$API_URL/products" | python3 -c "import sys,json; assert len(json.load(sys.stdin))>0"; then
              echo "Smoke test OK"; exit 0
            fi
            echo "API aun no responde, reintento $i"; sleep 10
          done
          exit 1
