<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pan de la Casa · Pedidos para recoger</title>
  <meta name="description" content="Haz tu pedido en Pan de la Casa y recógelo a la hora que prefieras.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥐</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <nav class="topbar">
      <span class="marca-icono" aria-hidden="true">🥐</span>
      <span class="marca">Pan de la Casa</span>
    </nav>
    <div class="hero-contenido">
      <h1>Pan recién horneado,<br>listo cuando llegues</h1>
      <p>Elige tus productos, dinos a qué hora pasas y te lo tenemos listo para recoger.</p>
    </div>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="titulo-catalogo">
      <h2 id="titulo-catalogo">Nuestro catálogo</h2>
      <div id="catalogo">Cargando catálogo...</div>
    </section>

    <aside class="panel pedido" aria-labelledby="titulo-pedido">
      <h2 id="titulo-pedido">Tu pedido</h2>
      <label class="campo">Nombre
        <input id="nombre" autocomplete="name" placeholder="¿A nombre de quién?">
      </label>
      <label class="campo">Hora de recogida
        <input id="hora" type="time">
      </label>
      <button id="enviar" class="boton">Hacer pedido</button>
      <div id="msg" role="status"></div>
    </aside>
  </main>

  <footer class="pie">Pan de la Casa · Pedidos web para recoger en tienda</footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
